<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCK — Third Culture Kid</title>
  <meta name="description" content="Three worlds. One identity. A portfolio introduction by John Kim.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="vignette" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow--left" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow--right" aria-hidden="true"></div>

  <main class="layout">
    <section class="content" aria-label="Introduction">
      <div class="content__top">
        <header class="content__header">
          <h1 class="content__title">TCK.</h1>
          <p class="content__subtitle">Third Culture Kid</p>
        </header>

        <div class="content__dots" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <blockquote class="content__tagline">
          <span class="content__tagline-arrow" aria-hidden="true">→</span>
          <span class="content__tagline-lines">
            <span>Three worlds,</span>
            <span>One identity</span>
          </span>
        </blockquote>
      </div>

      <button class="content__discover" type="button" aria-label="Discover the tetrahedron">
        <span class="content__discover-label">discover.</span>
        <span class="content__discover-line" aria-hidden="true"></span>
      </button>
    </section>

    <section class="canvas-panel" aria-label="Interactive tetrahedron">
      <div class="canvas-panel__frame">
        <canvas id="tetrahedron-canvas"></canvas>
      </div>
      <div class="canvas-panel__label" id="face-label" aria-live="polite"></div>
      <p class="canvas-panel__hint">Click a face to explore · Drag to rotate</p>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
